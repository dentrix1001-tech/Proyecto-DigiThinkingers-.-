name: Mantener Activo Supabase

on:
  schedule:
    - cron: '0 9 */4 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar estado del proyecto en Supabase
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://jgmqtslpyyponvvjwrft.supabase.co/storage/v1/object/public/digithinkingers-json/criterios-auditoria.json"
